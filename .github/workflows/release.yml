name: Release

# Publish a release on the GitHub website (Releases -> Draft a new release, tag like v0.1.0).
# This workflow then builds and tests the jar and attaches imgDupli.jar to that release.
# "Run workflow" in the Actions tab builds the same jar as a downloadable artifact without releasing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set version from tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: mvn -B -q versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B package

      - name: Rename jar
        run: cp target/imgDupli-*.jar imgDupli.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgDupli
          path: imgDupli.jar

      - name: Attach jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" imgDupli.jar --clobber
