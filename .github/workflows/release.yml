name: Release

# Push a tag like v0.1.0 to build, test and publish a GitHub release with the runnable jar.
# "Run workflow" in the Actions tab builds the same jar as a downloadable artifact without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B package

      - name: Rename jar
        run: cp target/imgDupli-*.jar imgDupli.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: imgDupli
          path: imgDupli.jar

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" imgDupli.jar \
            --title "imgDupli $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Requires Java 17 or newer. Start with: java -jar imgDupli.jar (or double-click)."
